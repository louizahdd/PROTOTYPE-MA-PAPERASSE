{/* Date and time — hidden for instant */}

</div>

<div style={{fontSize:9.5,color:m.f==="u"?"rgba(255,255,255,.45)":C.lt,marginTop:3,textAlign:"right"}}>{m.t}</div></div></div>)}</div>
<div style={{padding:"10px 24px 28px",borderTop:`1px solid ${C.bd}`,display:"flex",gap:8}}><div style={{flex:1,background:C.w,border:`1px solid ${C.bd}`,borderRadius:999,padding:"10px 16px"}}><input value={msg} onChange={e=>setMsg(e.target.value)} onKeyDown={e=>e.key==="Enter"&&snd()} placeholder="Votre message..." style={{border:"none",outline:"none",background:"transparent",width:"100%",fontSize:13.5,color:C.dk,fontFamily:"inherit"}}/></div>
<div onClick={snd} style={{width:40,height:40,borderRadius:"50%",background:C.cm,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}}><I d={ic.send} sz={16} cl="#fff"/></div></div></div>;}

/* ═══ MY PROFILE ═══ */
function MyProf({go,isAid,setAid}){return <div style={{paddingBottom:90}}>
<div style={{padding:"20px 24px"}}><div style={{fontSize:22,fontWeight:700,color:C.dk}}>Mon espace</div></div>
<div style={{padding:"0 24px 16px",display:"flex",alignItems:"center",gap:14}}><Av ini="LH" cl={C.cm} sz={56}/><div><div style={{fontSize:17,fontWeight:700,color:C.dk}}>Louiza Hadid</div><div style={{fontSize:12,color:C.md}}>Lorient</div></div></div>

{/* Mode switch also here */}
<div style={{margin:"0 24px 16px",display:"flex",background:C.cr,borderRadius:999,padding:3}}>
{["Demandeur","Aidant"].map((m,i)=><div key={m} onClick={()=>setAid(i===1)} style={{flex:1,padding:"10px",borderRadius:999,textAlign:"center",fontSize:13,fontWeight:600,cursor:"pointer",background:(i===0?!isAid:isAid)?C.w:"transparent",color:(i===0?!isAid:isAid)?C.dk:C.lt,transition:"all .2s"}}>{m}</div>)}
</div>

<div style={{padding:"0 24px"}}>{(isAid?[{l:"Tableau de bord",k:"dash"},{l:"Mes créneaux",k:"creneaux"},{l:"Mes revenus",k:"dash"}]:[{l:"Mes dossiers",k:"dossiers"},{l:"Mes documents",k:"docs"},{l:"Mes favoris",k:"favs"},{l:"Mes échéances",k:"ech"}]).concat([{l:"Notifications",k:"notifs"},{l:"Paramètres",k:"settings"},{l:"Aide",k:"help"},{l:"Déconnexion",k:"logout"}]).map(it=><div key={it.l} onClick={()=>it.k!=="logout"&&go("sub",it.k)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 0",borderBottom:`1px solid ${C.cr}`,cursor:it.k==="logout"?"default":"pointer"}}><span style={{fontSize:14,fontWeight:500,color:it.k==="logout"?C.rd:C.dk}}>{it.l}</span>{it.k!=="logout"&&<I d={ic.chev} sz={14} cl={C.lt}/>}</div>)}</div></div>;}

/* SUB PAGES */
function Dossiers({go}){return <Page title="Mes dossiers" onBk={()=>go("myProf")}>{DOSS.map(d=>{const a=AA.find(x=>x.id===d.aid);return <div key={d.id} onClick={()=>go("dossier",d)} style={{...cd,padding:14,marginBottom:10,cursor:"pointer"}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><div><div style={{fontSize:14,fontWeight:600,color:C.dk}}>{d.title}</div><div style={{fontSize:11.5,color:C.md}}>avec {a.sh}</div></div><span style={{fontSize:10,padding:"3px 10px",borderRadius:999,fontWeight:500,background:d.st==="done"?C.cr:d.st==="progress"?"#EFF7F1":"#FEF8F0",color:d.st==="done"?C.lt:d.st==="progress"?C.gn:"#B8860B"}}>{d.st==="done"?"Terminé":d.st==="progress"?"En cours":"En attente"}</span></div><Bar pct={d.pct} cl={d.st==="done"?C.gn:C.cm}/></div>})}</Page>;}

function DossierDetail({d,go}){const a=AA.find(x=>x.id===d.aid);return <Page title="Suivi" onBk={()=>go("home")}>
<div style={{...cd,padding:16,marginBottom:14}}><div style={{fontSize:17,fontWeight:700,color:C.dk,marginBottom:3}}>{d.title}</div><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}><Av ini={a.ini} cl={a.cl} sz={26}/><span style={{fontSize:12,color:C.md}}>avec {a.nm}</span></div><Bar pct={d.pct}/><div style={{display:"flex",justifyContent:"space-between",marginTop:6}}><span style={{fontSize:11,color:C.lt}}>Progression</span><span style={{fontSize:11,fontWeight:600,color:C.cm}}>{d.pct}%</span></div></div>
<div style={{fontSize:14,fontWeight:700,color:C.dk,marginBottom:10}}>Étapes</div>
{d.steps.map((s,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 0",borderBottom:i<d.steps.length-1?`1px solid ${C.cr}`:"none"}}><div style={{width:22,height:22,borderRadius:"50%",border:`2px solid ${s.ok?C.gn:C.bd}`,background:s.ok?C.gn:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{s.ok&&<I d={ic.check} sz={12} cl="#fff" sw={3}/>}</div><span style={{fontSize:13,color:s.ok?C.dk:C.lt}}>{s.t}</span></div>)}</Page>;}

function MyDocs({go}){return <Page title="Documents" onBk={()=>go("myProf")}>{[{n:"Avis_imposition_2025.pdf",d:"14 mars",s:"1.2 Mo"},{n:"APL_dossier_complet.pdf",d:"10 mars",s:"3.4 Mo"},{n:"CV_Louiza_Hadid.pdf",d:"6 mars",s:"890 Ko"}].map((d,i)=><div key={i} style={{...cd,padding:14,marginBottom:8,display:"flex",alignItems:"center",gap:12}}><div style={{width:40,height:40,borderRadius:10,background:C.cr,display:"flex",alignItems:"center",justifyContent:"center"}}><I d={ic.file} sz={18}/></div><div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:C.dk}}>{d.n}</div><div style={{fontSize:11,color:C.lt}}>{d.d} · {d.s}</div></div></div>)}</Page>;}

function MyFavs({go,favs}){const fa=AA.filter(a=>favs.has(a.id));return <Page title="Favoris" onBk={()=>go("myProf")}>{fa.length?fa.map(a=><div key={a.id} onClick={()=>go("prof",null,a)} style={{...cd,padding:14,marginBottom:8,display:"flex",gap:12,cursor:"pointer"}}><Av ini={a.ini} cl={a.cl} sz={44} on={a.on}/><div style={{flex:1}}><div style={{fontSize:14,fontWeight:600,color:C.dk}}>{a.nm}</div><div style={{fontSize:12,color:C.md}}>{a.sp}</div></div></div>):<div style={{textAlign:"center",padding:30,color:C.lt,fontSize:13}}>Pas encore de favoris</div>}</Page>;}

function MyEch({go}){return <Page title="Échéances" onBk={()=>go("myProf")}>{ECHS.map((e,i)=><div key={i} style={{...cd,padding:14,marginBottom:8}}><div style={{display:"flex",justifyContent:"space-between"}}><div style={{fontSize:14,fontWeight:600,color:C.dk}}>{e.title}</div><span style={{fontSize:10,padding:"3px 10px",borderRadius:999,fontWeight:500,background:e.days<=14?"#FDF0EC":e.days<=30?"#FEF8F0":C.cr,color:e.days<=14?C.rd:e.days<=30?"#B8860B":C.lt}}>{e.days}j</span></div><div style={{fontSize:12,color:C.md,marginTop:3}}>{e.date}</div></div>)}</Page>;}

function Notifs({go,from}){return <Page title="Notifications" onBk={()=>go(from||"home")}>{[{t:"Dossier mis à jour",d:"Vos justificatifs ont été analysés par Sophie",c:C.gn},{t:"Rappel visio",d:"Séance avec Sophie vendredi à 15h",c:C.cm},{t:"Échéance proche",d:"Renouvellement APL dans 16 jours",c:C.rd}].map((n,i)=><div key={i} style={{...cd,padding:14,marginBottom:8,display:"flex",gap:12}}><div style={{width:8,height:8,borderRadius:"50%",background:n.c,marginTop:6,flexShrink:0}}/><div><div style={{fontSize:13.5,fontWeight:600,color:C.dk}}>{n.t}</div><div style={{fontSize:12,color:C.md,marginTop:2}}>{n.d}</div></div></div>)}</Page>;}

function Settings({go}){return <Page title="Paramètres" onBk={()=>go("myProf")}>{["Modifier profil","Mot de passe","Notifications","Confidentialité"].map((it,i)=><div key={i} style={{padding:"14px 0",borderBottom:`1px solid ${C.cr}`,fontSize:13.5,fontWeight:500,color:C.dk,cursor:"pointer"}}>{it}</div>)}</Page>;}

function Help({go}){return <Page title="Aide" onBk={()=>go("myProf")}><div style={{...cd,padding:16,marginBottom:10}}><div style={{fontSize:14,fontWeight:600,color:C.dk,marginBottom:6}}>Comment ça marche ?</div><div style={{fontSize:13,color:C.md,lineHeight:1.6}}>Décrivez votre besoin, choisissez un aidant, réservez une séance, et suivez votre dossier en temps réel.</div></div><div style={{...cd,padding:16}}><div style={{fontSize:14,fontWeight:600,color:C.dk,marginBottom:6}}>Contact</div><div style={{fontSize:13,color:C.cm}}>contact@mapaperasse.fr</div></div></Page>;}

function AidDash({go,isAid,setAid}){return <div style={{paddingBottom:90}}>
<div style={{padding:"20px 24px",display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}><div><div style={{fontSize:22,fontWeight:700,color:C.dk}}>Tableau de bord</div><div style={{fontSize:12,color:C.gn,fontWeight:500,marginTop:2}}>Mode aidant</div></div><ModeSwitch isAid={isAid} set={setAid}/></div>
<div style={{padding:"0 24px",display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:18}}>
{[{v:"1 240€",l:"Revenus",c:C.cm},{v:"47",l:"Séances",c:C.dk},{v:"★ 4.9",l:"Note",c:C.cm},{v:"12",l:"Ce mois",c:C.dk}].map((k,i)=><div key={i} style={{...cd,padding:16,textAlign:"center"}}><div style={{fontSize:22,fontWeight:700,color:k.c}}>{k.v}</div><div style={{fontSize:10.5,color:C.lt,marginTop:2}}>{k.l}</div></div>)}</div>
<div style={{padding:"0 24px"}}><div style={{fontSize:15,fontWeight:700,color:C.dk,marginBottom:10}}>Prochaines séances</div>
{[{n:"Julie D.",d:"Ven 21 · 15:00",m:"Visio",cat:"Impôts"},{n:"Pierre M.",d:"Sam 22 · 10:00",m:"Tél",cat:"APL"},{n:"Nadia C.",d:"Lun 24 · 14:00",m:"Présentiel",cat:"Logement"}].map((b,i)=><div key={i} style={{...cd,padding:14,marginBottom:8,display:"flex",alignItems:"center",gap:12}}>
<Av ini={b.n.split(" ").map(w=>w[0]).join("")} cl={["#A67B52","#5C8A84","#7D6B99"][i]} sz={38}/>
<div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:C.dk}}>{b.n}</div><div style={{fontSize:11.5,color:C.md}}>{b.d} · {b.m}</div></div>
<span style={{fontSize:10.5,padding:"3px 10px",borderRadius:999,background:C.cr,color:C.cm,fontWeight:500}}>{b.cat}</span></div>)}</div></div>;}

/* ═══ APP ═══ */
export default function App(){
const[sc,setSc]=useState("onboard");const[tab,setTab]=useState("home");const[cat,setCat]=useState(null);const[aid,setAid]=useState(null);const[bki,setBki]=useState(null);const[ca,setCa]=useState(null);const[sub,setSub]=useState(null);const[favs,setFavs]=useState(new Set([1,4]));const[isAid,setIsAid]=useState(false);const[doss,setDoss]=useState(null);const[nFrom,setNFrom]=useState("home");
const tFav=id=>setFavs(f=>{const n=new Set(f);n.has(id)?n.delete(id):n.add(id);return n});

const go=(target,data,aidant)=>{
if(target==="home"){setSc("home");setTab("home");setCat(null)}
else if(target==="srch"){setCat(data);setSc("srch")}
else if(target==="srchT")setSc("srchT")
else if(target==="prof"){if(aidant)setAid(aidant);setSc("prof")}
else if(target==="back")setSc(cat?"srch":"home")
else if(target==="bok")setSc("bok")
else if(target==="conf"){setBki(data);setSc("conf")}
else if(target==="visio")setSc("visio")
else if(target==="rate")setSc("rate")
else if(target==="msgL")setSc("msgL")
else if(target==="cht"){if(aidant)setCa(aidant);setSc("cht")}
else if(target==="myProf")setSc("myProf")
else if(target==="notifs"){setNFrom(sc);setSc("notifs")}
else if(target==="dossier"){setDoss(data);setSc("dossier")}
else if(target==="ech"){setSub("ech");setSc("sub")}
else if(target==="sub"){setSub(data);setSc("sub")}
else if(target==="dash")setSc("aidDash")
};

const goTab=t=>{setTab(t);if(isAid){if(t==="dash")setSc("aidDash");else if(t==="messages")setSc("msgL");else if(t==="profile")setSc("myProf")}else{if(t==="home"){setSc("home");setCat(null)}else if(t==="search")setSc("srchT");else if(t==="messages")setSc("msgL");else if(t==="profile")setSc("myProf")}};

// When switching mode from header, go to appropriate screen
const handleModeSwitch=(v)=>{setIsAid(v);if(v){setTab("dash");setSc("aidDash")}else{setTab("home");setSc("home")}};

let ct;
switch(sc){
case"onboard":ct=<Onboard done={()=>go("home")}/>; break;
case"home":ct=<Home go={go} favs={favs} tFav={tFav} isAid={isAid} setAid={handleModeSwitch}/>; break;
case"srch":ct=<Srch cat={cat} go={go} favs={favs} tFav={tFav}/>; break;
case"srchT":ct=<Srch cat={null} go={go} favs={favs} tFav={tFav}/>; break;
case"prof":ct=<Prof a={aid} go={go} favs={favs} tFav={tFav}/>; break;
case"bok":ct=<Bok a={aid} go={go}/>; break;
case"conf":ct=<Conf a={aid} info={bki} go={go}/>; break;
case"visio":ct=<Visio a={aid} go={go}/>; break;
case"rate":ct=<Rate a={aid} go={go}/>; break;
case"msgL":ct=<MsgL go={go}/>; break;
case"cht":ct=<Cht a={ca||aid} go={go}/>; break;
case"myProf":ct=<MyProf go={go} isAid={isAid} setAid={handleModeSwitch}/>; break;
case"sub":ct=sub==="dossiers"?<Dossiers go={go}/>:sub==="docs"?<MyDocs go={go}/>:sub==="favs"?<MyFavs go={go} favs={favs}/>:sub==="ech"?<MyEch go={go}/>:sub==="notifs"?<Notifs go={go} from="myProf"/>:sub==="settings"?<Settings go={go}/>:sub==="help"?<Help go={go}/>:sub==="dash"?<AidDash go={go} isAid={isAid} setAid={handleModeSwitch}/>:sub==="creneaux"?<Page title="Mes créneaux" onBk={()=>go("myProf")}><div style={{...cd,padding:16,textAlign:"center",color:C.cm,fontSize:13}}>Gérer mes disponibilités</div></Page>:null; break;
case"dossier":ct=<DossierDetail d={doss} go={go}/>; break;
case"notifs":ct=<Notifs go={go} from={nFrom}/>; break;
case"aidDash":ct=<AidDash go={go} isAid={isAid} setAid={handleModeSwitch}/>; break;
default:ct=<Home go={go} favs={favs} tFav={tFav} isAid={isAid} setAid={handleModeSwitch}/>;
}
const noNav=["cht","conf","visio","rate","onboard","dossier"].includes(sc);
return <div style={{maxWidth:430,margin:"0 auto",minHeight:"100vh",fontFamily:"system-ui,-apple-system,sans-serif",display:"flex",flexDirection:"column",position:"relative",background:sc==="visio"?"#111":C.bg}}>{ct}{!noNav&&<Nav ac={tab} go={goTab} aid={isAid}/>}</div>;
}


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
